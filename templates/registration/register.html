{% extends 'tracker/base.html' %}

{% block content %}
<section class="vh-100 gradient-custom">
    <div class="container py-2 h-100">
        <div class="row d-flex justify-content-center align-items-center h-80">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <div class="card bg-dark text-white" style="border-radius: 1rem;">
                    <div class="card-body p-3 text-center">

                        <form class="mb-md-2 mt-md-2 pb-3" method="post">
                            {% csrf_token %}
                            <h2 class="fw-bold mb-4 text-uppercase">Register</h2>

                            {% for field in form %}
                                <div data-mdb-input-init class="form-outline form-white mb-4">
                                    <input
                                            type="{{ field.field.widget.input_type }}"
                                            class="form-control form-control-lg"
                                            name="{{ field.name }}"
                                            id="{{ field.id_for_label }}"
                                    >
                                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                                    {% if field.errors %}
                                        <div class="text-danger">
                                            {{ field.errors }}
                                        </div>
                                    {% endif %}
                                </div>
                            {% endfor %}
                            <button data-mdb-button-init data-mdb-ripple-init class="btn btn-outline-light btn-lg px-5"
                                    type="submit">Register
                            </button>
                        </form>

                        <div>
                            <p class="mb-0">Have an account? <a href="{% url 'login' %}" class="text-white-50 fw-bold">Login</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
