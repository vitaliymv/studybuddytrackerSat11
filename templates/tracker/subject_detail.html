{% extends 'tracker/base.html' %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center">
        <h1>{{ subject.name }}</h1>

        <form method="post" action="{% url 'delete_subject' subject.id %}">
            {% csrf_token %}
            <button class="btn btn-danger">
                Delete
            </button>
        </form>
    </div>
{% endblock %}
